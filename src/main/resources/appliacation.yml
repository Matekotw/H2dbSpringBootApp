server:
  port: 8080 #Set the port for application


spring:
  datasource:
    url: jdbc:h2:mem:testdb #Url for H2 database in memory mode
    driver-class-name: org.h2.Driver #The JDBC driver for H2
    username: sa
    password:
  h2:
    console:
      enabled: true


  jpa:
    hibernate:
      ddl-auto: update #Automatically creates or updates the database schema

    show-sql: true #Enables Logging for SQL queries generated by JPA